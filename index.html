<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SY Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SY Bot</h1>
        </div>
        <div class="api-key-section">
            <label for="api-key">OpenRouter API Key:</label>
            <input type="password" id="api-key" placeholder="Enter your API key">
        </div>
        <div class="chat-container" id="chat-container">
            <div class="message bot">
                <div class="message-content">
                    <strong>SY Bot</strong> Hello! I'm SY Bot powered by SY's big brain. I can help you with coding questions and more. Here's an example of how code blocks look:

<div class="code-block" id="example-code">
    <div class="code-header">
        <span class="code-language">javascript</span>
        <button class="copy-button" onclick="copyCode('example-code')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1" stroke="currentColor" stroke-width="2"/>
            </svg>
            Copy
        </button>
    </div>
    <div class="code-content"><span class="keyword">function</span> <span class="function">greetUser</span>(name) {
    <span class="keyword">const</span> greeting = <span class="string">"Hello, "</span> + name + <span class="string">"!"</span>;
    console.log(greeting);
    <span class="keyword">return</span> greeting;
}</div>
</div>

What would you like to know?
                </div>
            </div>
        </div>
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Message SY Bot..." disabled rows="1"></textarea>
                <button id="send-button" disabled>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11L12 6L17 11M12 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
